  <script>
    const listenButton = document.getElementById("listen-button");
    const listenStart = document.getElementById("listen-start");
    const listenOptions = document.getElementById("listen-options");
    const closeListen = document.getElementById("close-listen");
    const listenPopup = document.getElementById("listen-popup");

    listenButton.addEventListener("click", (event) => {
        event.preventDefault();

        listenStart.style.display = "none";
        listenOptions.style.display = "flex";
    });

    closeListen.addEventListener("click", () => {
        listenPopup.style.display = "none";
    });
</script>

  <script>
    const video = document.getElementById("site-video");
    const soundButton = document.getElementById("sound-toggle");

    soundButton.addEventListener("click", () => {

      video.muted = !video.muted;

      if (video.muted) {
        soundButton.textContent = "🔇";
        soundButton.setAttribute("aria-label", "Turn sound on");
      } else {
        soundButton.textContent = "🔊";
        soundButton.setAttribute("aria-label", "Turn sound off");
      }

    });
  </script>
